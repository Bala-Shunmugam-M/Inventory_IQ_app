# Name kept from the old proxy so the already-deployed workers.dev URL keeps working.
name = "inventoryiq-llm-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"
account_id = "3ff2aa59d592dda71799cca963c855a9"

# Secret (do NOT put the key here — set it with:  wrangler secret put GROQ_API_KEY)
# The key is then available as env.GROQ_API_KEY inside src/index.js

# Per-IP rate limit: 20 calls per minute (AI calls and store creation are counted separately).
# Read in src/index.js as env.LIMITER.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Store snapshots. Run `wrangler d1 create inventoryiq` and paste the printed database_id below,
# then apply the schema: wrangler d1 execute inventoryiq --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "inventoryiq"
database_id = "PASTE-DATABASE-ID-FROM-wrangler-d1-create"
