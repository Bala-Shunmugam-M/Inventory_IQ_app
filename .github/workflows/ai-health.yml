name: AI health

# Catches a retired/renamed Groq model or a dead key before users do. A failed run emails the repo owner.
on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Worker up and cloud-sync database reachable
        run: |
          W=https://inventoryiq-llm-proxy.balashunmugamruthran.workers.dev
          curl -sSf --max-time 30 "$W/api/health" | jq -e '.ok == true' > /dev/null
          # /api/health never touches D1. A fake store forces a SELECT on the stores table:
          # 401 means the DB answered; a 500 means the table or binding is broken. Writes nothing.
          code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer healthcheck' "$W/api/stores/IQ-AAAAAAAAAA/snapshot")
          echo "fake-store snapshot -> $code"
          [ "$code" = 401 ]

      - uses: actions/checkout@v4
      - name: Cloud-sync round trip (save, read back, reject stale write)
        env:
          HEALTH_STORE_ID: ${{ secrets.HEALTH_STORE_ID }}
          HEALTH_STORE_TOKEN: ${{ secrets.HEALTH_STORE_TOKEN }}
        run: node .github/live-sync.mjs

      - name: Call /api/ai and expect a complete JSON reply
        run: |
          # Origin must be the Pages site or the Worker returns 403. Uses 1 of the 300 daily AI calls.
          # Asks for JSON like the pages do: fails if the reply is cut off (finish_reason "length",
          # e.g. reasoning eating the token budget) or isn't parseable JSON.
          out=$(curl -sS --max-time 60 -X POST \
            -H 'Origin: https://bala-shunmugam-m.github.io' \
            -H 'Content-Type: text/plain;charset=UTF-8' \
            -d '{"messages":[{"role":"system","content":"Return only a JSON object, no markdown."},{"role":"user","content":"Return {\"status\":\"ok\",\"items\":[1,2,3]} exactly."}],"temperature":0,"max_tokens":200}' \
            https://inventoryiq-llm-proxy.balashunmugamruthran.workers.dev/api/ai)
          echo "$out" | head -c 500; echo
          echo "$out" | jq -e '.choices[0].finish_reason == "stop"
            and (.choices[0].message.content | fromjson | .status == "ok" and (.items | length) == 3)' > /dev/null
